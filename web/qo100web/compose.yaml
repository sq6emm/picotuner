services:
  qo100web:
    build: .
    image: qo100web:latest
    container_name: qo100web
    restart: unless-stopped
    # host network: the tuner sends status, scan results and the TS (UDP base+1/+3/+5/+41) to this
    # machine's own address, the one the commands come from
    network_mode: host
    env_file: .env
    tmpfs:
      - /hls:size=64m,uid=1000,gid=1000
    labels:
      owner: claude
